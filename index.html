body {

}

/* =========================
   TELAS
========================= */

.screen {

}

.screen.active {

input {

    padding: 16px;

    font-size: 1rem;
    outline: none;
}

button {

    border-radius: 14px;
    padding: 16px;
    font-size: 1rem;
    font-weight: bold;
    cursor: pointer;
    transition: 0.15s;
}

    transform: scale(0.96);
}

.main-button {
    width: 100%;
    margin: 8px 0;
    background: #ffffff;
    color: #111;
}

.join-button {
    width: 100%;

    background: #444;
    color: white;
}

.divider {
    margin: 20px 0;

}

.message {
    min-height: 25px;

    color: #ffb4b4;
    font-weight: bold;
}

/* =========================
   LOBBY
========================= */

    padding: 25px;
    background: #202020;
}

    display: flex;
    align-items: center;

}

.room-code {

    padding: 15px;
    margin: 25px 0;
    text-align: left;
}

    justify-content: space-between;
    padding: 15px;

.player-row:last-child {

}

    height: 42px;
    border-radius: 50%;
    background: #555;

    align-items: center;
    justify-content: center;
    font-weight: bold;

.start-button {

========================= */

    justify-content: center;

    align-items: center;
    padding: 20px 0;

.round-info {
    color: #aaa;

.game-status {

    left: 0;

    display: block;

/* Mobile */

@media (max-width: 500px) {

    .white-card {

        height: 155px;
        margin-left: -45px;
        font-size: 0.72rem;
    }

    .black-card {
        min-height: 260px;
    }

}

</style>

function showScreen(screen) {

    document
        .querySelectorAll(".screen")
        .forEach(item => {

        });

    screen.classList.add("active");

}



/* =========================

========================= */

function generateRoomCode() {

    const characters =
        "ABCDEFGHJKLMNPQRSTUVWXYZ23456789";

    let code = "";

    for (
        let i = 0;
        i < 6;
        i++
    ) {

        code +=
            characters[
                Math.floor(
                    Math.random() *
                    characters.length
                )
            ];

    }

    return code;

}

    }

    return name;

}
