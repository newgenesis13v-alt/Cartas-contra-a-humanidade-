function showScreen(screen) {

    document
    .querySelectorAll(".screen")
    .forEach(item => {

        item.classList.remove("active");

    });

    screen.classList.add("active");

}



/* =====================================
   CÓDIGO DA SALA
===================================== */

function generateRoomCode() {

    const characters =
    "ABCDEFGHJKLMNPQRSTUVWXYZ23456789";

    let code = "";

    for (
        let i = 0;
        i < 6;
        i++
    ) {

        code +=
        characters[
            Math.floor(
                Math.random() *
                characters.length
            )
        ];

    }

    return code;

}

function getPlayerName() {

    const name =
    playerNameInput.value
    .trim();

    if (!name) {

        homeError.textContent =
        "Digite seu nome primeiro 😭";

        return null;

    }

    return name;

}

    if (!name) return;

    homeError.textContent = "";

    currentPlayerName = name;

    let code =

    const roomReference =
    ref(
        database,
        "rooms/" + code
    );

}

/* =====================================

===================================== */

joinRoomButton
.addEventListener(
"click",
async () => {

    const name =
    getPlayerName();

    if (!name) return;


    const code =
    roomCodeInput.value
    .trim()
    .toUpperCase();


    if (!code) {

        homeError.textContent =
        "Digite o código da sala 😭";

        return;

    }


    const roomReference =
    ref(
        database,
        "rooms/" + code
    );


    const snapshot =
    await get(roomReference);


    if (!snapshot.exists()) {

        homeError.textContent =
        "Essa sala não existe 💀";

        return;

    }


    const room =
    snapshot.val();


    if (
        room.status === "playing"
    ) {

        homeError.textContent =
        "A partida já começou 😭";

        return;

    }


    currentPlayerName = name;

    currentRoom = code;


    await set(

        ref(
            database,
            "rooms/" +
            currentRoom +
            "/players/" +
            playerId
        ),

        {

            name:
            currentPlayerName,

            joinedAt:
            Date.now()

        }

    );


    enterRoom();

}
);



/* =====================================
   ENTRAR NO LOBBY
===================================== */

function enterRoom() {

    roomCodeDisplay.textContent =
    currentRoom;

    gameRoomCode.textContent =
    currentRoom;

    showScreen(lobby);


    const playerReference =
    ref(
        database,
        "rooms/" +
        currentRoom +
        "/players/" +
        playerId
    );


    onDisconnect(
        playerReference
    )
    .remove();


    listenToRoom();

}



/* =====================================
   OUVIR SALA EM TEMPO REAL
===================================== */

function listenToRoom() {

    const roomReference =
    ref(
        database,
        "rooms/" +
        currentRoom
    );


    onValue(
        roomReference,
        snapshot => {

            if (
                !snapshot.exists()
            ) return;


            const room =
            snapshot.val();


            updateLobby(room);


            if (
                room.status ===
                "playing"
            ) {

                showGame(room);

            }

        }
    );

}



/* =====================================
   ATUALIZAR LOBBY
===================================== */

function updateLobby(room) {

    if (
        room.status !==
        "lobby"
    ) return;


    const players =
    room.players || {};


    const playersArray =
    Object.entries(players);


    playersList.innerHTML = "";


    playersArray.forEach(
        ([id, player]) => {

            const div =
            document.createElement("div");

            div.className =
            "player";

            div.textContent =
            player.name;


            if (
                id === room.host
            ) {

                const hostTag =
                document
                .createElement("span");

                hostTag.className =
                "host-tag";

                hostTag.textContent =
                "DONO";

                div.appendChild(
                    hostTag
                );

            }


            playersList.appendChild(
                div
            );

        }
    );


    startArea.innerHTML = "";


    if (
        room.host === playerId
    ) {

        const button =
        document.createElement(
            "button"
        );

        button.className =
        "primary";

        button.textContent =
        "▶ INICIAR PARTIDA";


        button.addEventListener(
        "click",
        () => startGame(room)
        );


        startArea.appendChild(
            button
        );


        lobbyMessage.textContent =
        "Você é o dono da sala 👑";

    }

    else {

        lobbyMessage.textContent =
        "Aguardando o dono iniciar a partida...";

    }

}
