<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Cartas Contra Talys</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #ece8df;
            color: #111;
            text-align: center;
            margin: 0;
            padding: 30px 15px;
        }

        h1 {
            margin-bottom: 5px;
        }

        input {
            width: 90%;
            max-width: 400px;
            padding: 15px;
            margin: 8px;
            border: 2px solid #111;
            border-radius: 10px;
            font-size: 16px;
        }

        button {
            padding: 15px 20px;
            margin: 8px;
            border: none;
            border-radius: 10px;
            background: #111;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        #message {
            margin-top: 20px;
            font-weight: bold;
            min-height: 30px;
        }
    </style>
</head>

<body>

    <h1>🃏 Cartas Contra Talys</h1>

    <p>Teste do multiplayer</p>

    <input
        id="playerName"
        placeholder="Seu nome"
        maxlength="20"
    >

    <br>

    <button id="createRoomButton">
        🏠 CRIAR SALA
    </button>

    <br>

    <input
        id="roomCodeInput"
        placeholder="Código da sala"
        maxlength="6"
    >

    <br>

    <button id="joinRoomButton">
        🔑 ENTRAR NA SALA
    </button>

    <div id="message"></div>


    <script type="module">

        import {
            initializeApp
        } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

        import {
            getDatabase,
            ref,
            set,
            get
        } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";


        /* CONFIGURAÇÃO DO FIREBASE */

        const firebaseConfig = {

            apiKey:
                "AIzaSyCw5UmpciDeaBoV8_PsgDGUvohu0_kafMM",

            authDomain:
                "cartas-contra-humanidade-d91e3.firebaseapp.com",

            databaseURL:
                "https://cartas-contra-humanidade-d91e3-default-rtdb.firebaseio.com/",

            projectId:
                "cartas-contra-humanidade-d91e3",

            storageBucket:
                "cartas-contra-humanidade-d91e3.firebasestorage.app",

            messagingSenderId:
                "546342432146",

            appId:
                "1:546342432146:web:17e6bb977a3d7e1a57a54b"

        };


        /* INICIAR FIREBASE */

        const app =
            initializeApp(firebaseConfig);

        const database =
            getDatabase(app);


        /* ELEMENTOS */

        const message =
            document.getElementById("message");

        const playerName =
            document.getElementById("playerName");

        const createRoomButton =
            document.getElementById("createRoomButton");

        const joinRoomButton =
            document.getElementById("joinRoomButton");

        const roomCodeInput =
            document.getElementById("roomCodeInput");


        /* TESTE: JAVASCRIPT CARREGOU */

        message.textContent =
            "✅ JavaScript carregado! Firebase conectado.";


        /* GERAR CÓDIGO */

        function generateRoomCode() {

            const characters =
                "ABCDEFGHJKLMNPQRSTUVWXYZ23456789";

            let code = "";

            for (let i = 0; i < 6; i++) {

                code +=
                    characters[
                        Math.floor(
                            Math.random() *
                            characters.length
                        )
                    ];

            }

            return code;

        }


        /* CRIAR SALA */

        createRoomButton.addEventListener(
            "click",
            async () => {

                try {

                    message.textContent =
                        "🟡 BOTÃO FUNCIONOU! Criando sala...";


                    const name =
                        playerName.value.trim();


                    if (!name) {

                        message.textContent =
                            "❌ Digita teu nome primeiro!";

                        return;

                    }


                    const roomCode =
                        generateRoomCode();


                    message.textContent =
                        "🟡 Criando sala " +
                        roomCode +
                        "...";


                    await set(

                        ref(
                            database,
                            "rooms/" +
                            roomCode
                        ),

                        {

                            host:
                                name,

                            status:
                                "lobby",

                            createdAt:
                                Date.now(),

                            players: {

                                [name.replace(
                                    /[^a-zA-Z0-9]/g,
                                    ""
                                )]:

                                {

                                    name:
                                        name

                                }

                            }

                        }

                    );


                    message.textContent =
                        "🟢 SALA CRIADA! Código: " +
                        roomCode;


                } catch (error) {

                    console.error(error);

                    message.textContent =
                        "🔴 ERRO: " +
                        error.message;

                }

            }
        );


        /* ENTRAR NA SALA */

        joinRoomButton.addEventListener(
            "click",
            async () => {

                try {

                    const code =
                        roomCodeInput.value
                            .trim()
                            .toUpperCase();


                    if (!code) {

                        message.textContent =
                            "❌ Digita o código da sala!";

                        return;

                    }


                    message.textContent =
                        "🟡 Procurando sala...";


                    const snapshot =
                        await get(

                            ref(
                                database,
                                "rooms/" +
                                code
                            )

                        );


                    if (!snapshot.exists()) {

                        message.textContent =
                            "💀 Essa sala não existe.";

                        return;

                    }


                    message.textContent =
                        "🟢 ENCONTREI A SALA " +
                        code +
                        "!";

                } catch (error) {

                    console.error(error);

                    message.textContent =
                        "🔴 ERRO: " +
                        error.message;

                }

            }
        );

    </script>

</body>
    </html>
