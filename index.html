<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Cartas Contra Talys</title>

<style>
body{
    margin:0;
    min-height:100vh;
    font-family:Arial;
    background:#181818;
    color:white;
    display:flex;
    justify-content:center;
    align-items:center;
}

.box{
    width:85%;
    max-width:400px;
    background:#292929;
    padding:25px;
    border-radius:20px;
    text-align:center;
}

input,button{
    width:100%;
    padding:15px;
    margin:7px 0;
    border:none;
    border-radius:12px;
    font-size:16px;
}

button{
    font-weight:bold;
}

#create{
    background:white;
    color:black;
}

#join{
    background:#555;
    color:white;
}

#room{
    font-size:28px;
    letter-spacing:4px;
    font-weight:bold;
}

#msg{
    color:#ffaaaa;
}
</style>
</head>

<body>

<div class="box">

    <h1>🃏 CARTAS<br>CONTRA TALYS</h1>

    <input id="name" placeholder="Seu nome">

    <button id="create">
        🏠 CRIAR SALA
    </button>

    <hr>

    <input id="code" placeholder="Código da sala">

    <button id="join">
        🔑 ENTRAR
    </button>

    <p id="msg"></p>

    <div id="room"></div>

</div>


<script type="module">

import {
    initializeApp
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {
    getDatabase,
    ref,
    set,
    get
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";


const firebaseConfig = {
    apiKey: "AIzaSyCw5UmpciDeaBoV8_PsgDGUvohu0_kafMM",
    authDomain: "cartas-contra-humanidade-d91e3.firebaseapp.com",
    databaseURL: "https://cartas-contra-humanidade-d91e3-default-rtdb.firebaseio.com/",
    projectId: "cartas-contra-humanidade-d91e3",
    storageBucket: "cartas-contra-humanidade-d91e3.firebasestorage.app",
    messagingSenderId: "546342432146",
    appId: "1:546342432146:web:17e6bb977a3d7e1a57a54b"
};


const app = initializeApp(firebaseConfig);
const db = getDatabase(app);


function roomCode(){

    return Math.random()
        .toString(36)
        .substring(2,8)
        .toUpperCase();

}


document
.getElementById("create")
.addEventListener("click", async () => {

    const name =
        document
        .getElementById("name")
        .value
        .trim();


    if(!name){

        document
        .getElementById("msg")
        .textContent =
        "Digite seu nome.";

        return;

    }


    const code =
        roomCode();


    try{

        await set(
            ref(db, "rooms/" + code),
            {
                host:name,
                status:"lobby"
            }
        );


        document
        .getElementById("room")
        .textContent =
        "SALA: " + code;


        document
        .getElementById("msg")
        .textContent =
        "Sala criada!";

    }

    catch(error){

        document
        .getElementById("msg")
        .textContent =
        error.message;

    }

});


document
.getElementById("join")
.addEventListener("click", async () => {

    const code =
        document
        .getElementById("code")
        .value
        .trim()
        .toUpperCase();


    if(!code) return;


    try{

        const snapshot =
            await get(
                ref(
                    db,
                    "rooms/" + code
                )
            );


        if(
            snapshot.exists()
        ){

            document
            .getElementById("room")
            .textContent =
            "ENTROU NA SALA: " +
            code;

        }

        else{

            document
            .getElementById("msg")
            .textContent =
            "Sala não encontrada.";

        }

    }

    catch(error){

        document
        .getElementById("msg")
        .textContent =
        error.message;

    }

});

</script>

</body>
</html>
