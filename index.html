function showScreen(screen) {

    document
    .querySelectorAll(".screen")
    .forEach(
        function (s) {

            s.classList
            .remove("active");

        }
    );


    screen.classList
    .add("active");

}


/* ================= CÓDIGO DA SALA ================= */

function generateRoomCode() {

    const chars =
        "ABCDEFGHJKLMNPQRSTUVWXYZ23456789";

    let code =
        "";


    for (
        let i = 0;
        i < 6;
        i++
    ) {

        code +=
            chars[
                Math.floor(
                    Math.random() *
                    chars.length
                )
            ];

    }


    return code;

}


/* ================= EMBARALHAR ================= */

function shuffle(array) {

    const copy =
        [...array];


    for (
        let i =
            copy.length - 1;
        i > 0;
        i--
    ) {

        const j =
            Math.floor(
                Math.random() *
                (i + 1)
            );


        [
            copy[i],
            copy[j]
        ] =
        [
            copy[j],
            copy[i]
        ];

    }


    return copy;

}
