<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Cartas Contra Talys</title>

<style>
* {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}

body {
    margin: 0;
    min-height: 100vh;
    font-family: Arial, Helvetica, sans-serif;
    background: #181818;
    color: white;
}

.screen {
    display: none;
    min-height: 100vh;
}

.screen.active {
    display: flex;
}

/* HOME */

#home {
    flex-direction: column;
    justify-content: center;
    align-items: center;
    padding: 25px;
    text-align: center;
    background: radial-gradient(circle at top, #444, #151515 70%);
}

.logo {
    margin-bottom: 30px;
}

.logo h1 {
    font-size: clamp(2.5rem, 11vw, 4rem);
    margin: 0;
    line-height: 0.9;
}

.logo p {
    color: #aaa;
}

.menu-card {
    width: 100%;
    max-width: 420px;
    background: #292929;
    padding: 22px;
    border-radius: 24px;
}

input {
    width: 100%;
    border: none;
    border-radius: 14px;
    padding: 16px;
    margin: 7px 0;
    font-size: 16px;
}

button {
    width: 100%;
    border: none;
    border-radius: 14px;
    padding: 17px;
    margin: 7px 0;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
}

button:active {
    transform: scale(0.97);
}

#createRoomButton {
    background: white;
    color: black;
}

#joinRoomButton {
    background: #484848;
    color: white;
}

.divider {
    margin: 15px 0;
    color: #999;
}

#message {
    min-height: 25px;
    margin-top: 8px;
    color: #ffb0b0;
}

/* LOBBY */

#lobby {
    flex-direction: column;
    padding: 20px;
    background: #181818;
}

.top-bar {
    display: flex;
    justify-content: space-between;
    align-items: center;
}

.room-code {
    background: white;
    color: black;
    padding: 10px 16px;
    border-radius: 12px;
    letter-spacing: 3px;
    font-weight: bold;
}

.lobby-content {
    width: 100%;
    max-width: 550px;
    margin: auto;
    text-align: center;
}

.players-box {
    background: #292929;
    border-radius: 20px;
    margin: 25px 0;
    padding: 10px;
}

.player-row {
    padding: 15px;
    border-bottom: 1px solid #444;
    display: flex;
    justify-content: space-between;
    align-items: center;
}

.player-row:last-child {
    border-bottom: none;
}

.host {
    font-size: 11px;
    background: white;
    color: black;
    padding: 5px 8px;
    border-radius: 8px;
}

#startButton {
    background: white;
    color: black;
}

/* JOGO */

#game {
    flex-direction: column;
    min-height: 100vh;
    padding: 15px;
    padding-bottom: 200px;
    background: radial-gradient(circle at center, #3a3a3a, #121212 80%);
}

#opponents {
    display: flex;
    justify-content: center;
    gap: 10px;
    flex-wrap: wrap;
}

.opponent {
    background: #292929;
    border-radius: 15px;
    padding: 10px 13px;
    font-size: 14px;
}

.game-center {
    flex: 1;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
}

#roundInfo {
    color: #aaa;
    margin-bottom: 15px;
}

#blackCard {
    width: min(85vw, 390px);
    min-height: 280px;
    background: black;
    border-radius: 22px;
    padding: 25px;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    font-size: 21px;
    font-weight: bold;
    line-height: 1.35;
}

#gameStatus {
    margin-top: 18px;
    color: #aaa;
}

#playButton {
    display: none;
    position: fixed;
    bottom: 185px;
    left: 50%;
    transform: translateX(-50%);
    width: auto;
    padding: 15px 30px;
    background: white;
    color: black;
    z-index: 10;
}

#playButton.show {
    display: block;
}

.hand-area {
    position: fixed;
    bottom: 0;
    left: 0;
    width: 100%;
    padding: 10px;
    background: linear-gradient(transparent, #000 30%);
}

.hand-title {
    text-align: center;
    color: #aaa;
    font-size: 12px;
    margin-bottom: 5px;
}

#hand {
    display: flex;
    justify-content: center;
    align-items: flex-end;
    overflow-x: auto;
    padding: 15px 5px;
}

.white-card {
    flex: 0 0 115px;
    height: 160px;
    background: white;
    color: black;
    border-radius: 13px;
    margin-left: -38px;
    padding: 12px;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    font-weight: bold;
    font-size: 12px;
    box-shadow: 0 5px 15px rgba(0,0,0,.4);
    transition: transform .15s;
}

.white-card:first-child {
    margin-left: 0;
}

.white-card.selected {
    transform: translateY(-30px);
}

.white-card.disabled {
    opacity: .5;
}
</style>
</head>

<body>

<!-- HOME -->
<section id="home" class="screen active">

    <div class="logo">
        <h1>🃏 CARTAS<br>CONTRA TALYS</h1>
        <p>Onde a dignidade é opcional.</p>
    </div>

    <div class="menu-card">

        <input id="playerName" placeholder="Seu nome" maxlength="20">

        <button id="createRoomButton">🏠 CRIAR SALA</button>

        <div class="divider">──── OU ────</div>

        <input id="roomCodeInput" placeholder="Código da sala" maxlength="6">

        <button id="joinRoomButton">🔑 ENTRAR</button>

        <div id="message"></div>

    </div>

</section>


<!-- LOBBY -->
<section id="lobby" class="screen">

    <div class="top-bar">
        <strong>🃏 SALA</strong>
        <div id="roomCodeDisplay" class="room-code">------</div>
    </div>

    <div class="lobby-content">

        <h1>Esperando jogadores...</h1>

        <p style="color:#aaa">
            Mande o código para seus amigos.
        </p>

        <div class="players-box" id="playersList"></div>

        <button id="startButton">
            ▶ INICIAR PARTIDA
        </button>

        <p id="lobbyMessage"></p>

    </div>

</section>


<!-- JOGO -->
<section id="game" class="screen">

    <div id="opponents"></div>

    <div class="game-center">

        <div id="roundInfo">
            RODADA 1
        </div>

        <div id="blackCard">
            Aguardando a carta...
        </div>

        <div id="gameStatus">
            Escolha uma carta.
        </div>

    </div>

    <button id="playButton">
        JOGAR CARTA
    </button>

    <div class="hand-area">

        <div class="hand-title">
            SUAS CARTAS
        </div>

        <div id="hand"></div>

    </div>

</section>


<script type="module">

import {
    initializeApp
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {
    getDatabase,
    ref,
    set,
    update,
    get,
    onValue
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";


const firebaseConfig = {

    apiKey: "AIzaSyCw5UmpciDeaBoV8_PsgDGUvohu0_kafMM",

    authDomain:
        "cartas-contra-humanidade-d91e3.firebaseapp.com",

    databaseURL:
        "https://cartas-contra-humanidade-d91e3-default-rtdb.firebaseio.com/",

    projectId:
        "cartas-contra-humanidade-d91e3",

    storageBucket:
        "cartas-contra-humanidade-d91e3.firebasestorage.app",

    messagingSenderId:
        "546342432146",

    appId:
        "1:546342432146:web:17e6bb977a3d7e1a57a54b"

};


const app = initializeApp(firebaseConfig);
const database = getDatabase(app);


/* CARTAS */

const blackCards = [
    "O jantar acabou quando alguém mencionou ______.",
    "Minha família nunca mais falou comigo depois de ______.",
    "A pior coisa encontrada no meu celular foi ______.",
    "O debate ficou estranho quando alguém falou sobre ______.",
    "A polícia ficou interessada depois de encontrar ______."
];

const whiteCards = [
    "Meu tio dando uma opinião que ninguém pediu.",
    "Um segredo de família extremamente inconveniente.",
    "A pior mensagem enviada para a pessoa errada.",
    "Uma opinião política destruindo o almoço.",
    "A frase 'eu posso explicar'.",
    "Um áudio que nunca deveria existir.",
    "Ser o motivo de uma reunião urgente.",
    "Aquele parente que ninguém convidou.",
    "Uma captura de tela extremamente comprometedora.",
    "Descobrir que todo mundo sabia.",
    "Uma desculpa pior que o crime.",
    "O silêncio depois de uma pergunta proibida.",
    "Meu histórico de pesquisa.",
    "Uma discussão completamente sem sentido.",
    "A pior decisão da minha vida."
];


/* VARIÁVEIS */

let playerId = localStorage.getItem("cartasPlayerId");

if (!playerId) {
    playerId = "p_" + Math.random().toString(36).slice(2);
    localStorage.setItem("cartasPlayerId", playerId);
}

let currentRoom = null;
let currentName = null;
let selectedCard = null;
let currentHand = [];
let submitted = false;


/* ELEMENTOS */

const home = document.getElementById("home");
const lobby = document.getElementById("lobby");
const game = document.getElementById("game");

const playerNameInput = document.getElementById("playerName");
const roomCodeInput = document.getElementById("roomCodeInput");

const createRoomButton =
    document.getElementById("createRoomButton");

const joinRoomButton =
    document.getElementById("joinRoomButton");

const startButton =
    document.getElementById("startButton");

const message =
    document.getElementById("message");

const roomCodeDisplay =
    document.getElementById("roomCodeDisplay");

const playersList =
    document.getElementById("playersList");

const lobbyMessage =
    document.getElementById("lobbyMessage");

const blackCard =
    document.getElementById("blackCard");

const hand =
    document.getElementById("hand");

const playButton =
    document.getElementById("playButton");

const opponents =
    document.getElementById("opponents");

const gameStatus =
    document.getElementById("gameStatus");


/* TELAS */

function showScreen(screen) {

    document.querySelectorAll(".screen")
        .forEach(s => s.classList.remove("active"));

    screen.classList.add("active");

}


/* CÓDIGO */

function generateRoomCode() {

    const chars =
        "ABCDEFGHJKLMNPQRSTUVWXYZ23456789";

    let code = "";

    for (let i = 0; i < 6; i++) {
        code += chars[
            Math.floor(
                Math.random() * chars.length
            )
        ];
    }

    return code;

}


/* CRIAR SALA */

createRoomButton.addEventListener(
    "click",
    async function () {

        try {

            const name =
                playerNameInput.value.trim();

            if (!name) {
                message.textContent =
                    "Digite seu nome.";
                return;
            }

            currentName = name;

            const code =
                generateRoomCode();

            message.textContent =
                "Criando sala...";

            await set(
                ref(
                    database,
                    "rooms/" + code
                ),
                {
                    host: playerId,
                    status: "lobby",
                    round: 0,

                    players: {
                        [playerId]: {
                            name: name
                        }
                    }
                }
            );

            currentRoom = code;

            enterLobby();

        } catch (error) {

            console.error(error);

            message.textContent =
                "Erro: " + error.message;

        }

    }
);


/* ENTRAR */

joinRoomButton.addEventListener(
    "click",
    async function () {

        try {

            const name =
                playerNameInput.value.trim();

            const code =
                roomCodeInput.value
                    .trim()
                    .toUpperCase();

            if (!name) {
                message.textContent =
                    "Digite seu nome.";
                return;
            }

            if (!code) {
                message.textContent =
                    "Digite o código.";
                return;
            }

            const snapshot =
                await get(
                    ref(
                        database,
                        "rooms/" + code
                    )
                );

            if (!snapshot.exists()) {
                message.textContent =
                    "Sala não encontrada.";
                return;
            }

            currentName = name;
            currentRoom = code;

            await set(
                ref(
                    database,
                    "rooms/" +
                    code +
                    "/players/" +
                    playerId
                ),
                {
                    name: name
                }
            );

            enterLobby();

        } catch (error) {

            console.error(error);

            message.textContent =
                "Erro: " + error.message;

        }

    }
);


/* LOBBY */

function enterLobby() {

    showScreen(lobby);

    roomCodeDisplay.textContent =
        currentRoom;

    const roomRef =
        ref(
            database,
            "rooms/" + currentRoom
        );

    onValue(
        roomRef,
        function (snapshot) {

            if (!snapshot.exists()) return;

            const room =
                snapshot.val();

            updateRoom(room);

        }
    );

}


function updateRoom(room) {

    if (room.status === "playing") {
        startGameScreen(room);
        return;
    }

    playersList.innerHTML = "";

    const players =
        room.players || {};

    Object.entries(players)
        .forEach(
            function ([id, player]) {

                const row =
                    document.createElement("div");

                row.className =
                    "player-row";

                row.innerHTML =
                    "<span>" +
                    player.name +
                    "</span>" +
                    (
                        id === room.host
                        ? "<span class='host'>CRIADOR</span>"
                        : ""
                    );

                playersList.appendChild(row);

            }
        );

    if (room.host === playerId) {

        startButton.style.display =
            "block";

        lobbyMessage.textContent =
            "Você pode iniciar a partida.";

    } else {

        startButton.style.display =
            "none";

        lobbyMessage.textContent =
            "Esperando o criador.";

    }

}


/* INICIAR */

startButton.addEventListener(
    "click",
    async function () {

        try {

            const card =
                blackCards[
                    Math.floor(
                        Math.random() *
                        blackCards.length
                    )
                ];

            await update(
                ref(
                    database,
                    "rooms/" +
                    currentRoom
                ),
                {
                    status: "playing",
                    round: 1,
                    blackCard: card
                }
            );

        } catch (error) {

            console.error(error);

            lobbyMessage.textContent =
                "Erro: " + error.message;

        }

    }
);


/* JOGO */

function startGameScreen(room) {

    showScreen(game);

    blackCard.textContent =
        room.blackCard ||
        "Aguardando...";

    createHand();

    renderOpponents(
        room.players || {}
    );

}


function createHand() {

    if (currentHand.length > 0) return;

    const shuffled =
        [...whiteCards]
        .sort(
            () =>
                Math.random() - 0.5
        );

    currentHand =
        shuffled.slice(0, 7);

    renderHand();

}


function renderHand() {

    hand.innerHTML = "";

    currentHand.forEach(
        function (card) {

            const cardElement =
                document.createElement("div");

            cardElement.className =
                "white-card";

            cardElement.textContent =
                card;

            if (card === selectedCard) {
                cardElement.classList.add(
                    "selected"
                );
            }

            if (!submitted) {

                cardElement.addEventListener(
                    "click",
                    function () {

                        selectedCard =
                            card;

                        renderHand();

                        playButton.classList.add(
                            "show"
                        );

                    }
                );

            }

            hand.appendChild(
                cardElement
            );

        }
    );

}


function renderOpponents(players) {

    opponents.innerHTML = "";

    Object.entries(players)
        .forEach(
            function ([id, player]) {

                if (id === playerId) return;

                const element =
                    document.createElement("div");

                element.className =
                    "opponent";

                element.textContent =
                    player.name +
                    " 🃏 7";

                opponents.appendChild(
                    element
                );

            }
        );

}


/* JOGAR */

playButton.addEventListener(
    "click",
    async function () {

        if (
            !selectedCard ||
            submitted
        ) return;

        try {

            submitted = true;

            playButton.classList.remove(
                "show"
            );

            gameStatus.textContent =
                "Carta enviada!";

            await set(
                ref(
                    database,
                    "rooms/" +
                    currentRoom +
                    "/submissions/" +
                    playerId
                ),
                {
                    card: selectedCard,
                    name: currentName
                }
            );

        } catch (error) {

            submitted = false;

            console.error(error);

            gameStatus.textContent =
                "Erro ao enviar carta.";

        }

    }
);

</script>

</body>
    </html>
